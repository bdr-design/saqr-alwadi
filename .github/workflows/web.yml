# The web site: the game whole as a page of its own outside Claude (tools/build_ios_web.py site -> build/site: its fonts,
# three.js, maps and models all on it, so it asks nothing of any other host; a manifest so a phone can put it on the
# home screen, landscape and full screen). Three ways out, each the owner's to switch on (store/README.md, «الويب»):
#   - GitHub Pages: Settings -> Pages -> Source: GitHub Actions. Then each push to main is live at
#     https://bdr-design.github.io/saqr-alwadi/ (Pages takes only the default branch).
#   - Cloudflare Pages: secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. Then each push goes up,
#     main as the site itself (saqr-alwadi.pages.dev), any other branch as a preview of its own.
#   - By hand: the run's artifact SaqrAlwadi-web is the site's folder, for any host that serves files as they are.
name: Web

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'tiles/**', 'sprites/**', 'models/**', 'maps/**', 'data/**', 'assets/originals/icons/**', 'tools/build.py', 'tools/build_ios_web.py', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install terser and Pillow (the page's JavaScript minified; the site's icons)
        run: |
          npm install terser
          python3 -m pip install --quiet pillow

      - name: Build the site
        run: |
          python3 tools/build.py
          python3 tools/build_ios_web.py site

      - name: The site's folder, to put up by hand
        uses: actions/upload-artifact@v4
        with:
          name: SaqrAlwadi-web
          path: build/site
          include-hidden-files: true
          retention-days: 14

      - name: For GitHub Pages (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Cloudflare Pages, if the repository holds its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "no Cloudflare secrets in the repository: not put on Cloudflare Pages"; exit 0
          fi
          npx --yes wrangler@3 pages project create saqr-alwadi --production-branch=main || true
          npx --yes wrangler@3 pages deploy build/site --project-name=saqr-alwadi --branch="${GITHUB_REF_NAME}" --commit-dirty=true

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # (until Pages is switched on in the settings this step fails, and says so in its log; the run stays green, the
      # artifact and Cloudflare above unaffected)
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
