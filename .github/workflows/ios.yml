# Builds the iOS app as an unsigned IPA. Install it with Sideloadly or AltStore, which sign it with your Apple ID.
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'ios/**', 'tiles/**', 'sprites/**', 'data/**', 'tools/build.py', 'tools/build_ios_web.py', '.github/workflows/ios.yml']

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the game into the app
        run: |
          python3 tools/build.py
          python3 tools/build_ios_web.py

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (no signing)
        run: |
          cd ios
          xcodebuild -project SaqrAlwadi.xcodeproj -scheme SaqrAlwadi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SaqrAlwadi.app Payload/
          zip -qry SaqrAlwadi-unsigned.ipa Payload
          ls -lh SaqrAlwadi-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SaqrAlwadi-unsigned-ipa
          path: ios/SaqrAlwadi-unsigned.ipa
          retention-days: 30
